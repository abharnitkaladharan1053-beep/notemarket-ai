services:
  - type: web
    name: notemarket-ai
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.server:app --host 0.0.0.0 --port 
    envVars:
      - key: PORT
        value: 10000
      - key: SUPABASE_URL
        value: https://wuybopnkyhctoapxovyy.supabase.co
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
